<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fceef5;
            margin: 0;
            padding: 40px 20px;
        }

        .profile-card {
            width: 320px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid #e5b5cd;
            border-radius: 18px;
            background-color: white;
            text-align: center;
            box-shadow: 0 6px 15px rgba(150, 90, 120, 0.15);
        }

        .profile-card img {
            width: 110px;
            height: 110px;
            border: 4px solid #f0c7dc;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #b34d7b;
            font-size: 24px;
            margin: 15px 0 5px;
        }

        h3 {
            color: #777;
            font-size: 15px;
            font-weight: normal;
            margin: 5px 0 15px;
        }

        p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .skills {
            background-color: #fceef5;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .skills span {
            display: inline-block;
            background-color: white;
            color: #b34d7b;
            padding: 6px 9px;
            margin: 4px;
            border: 1px solid #e5b5cd;
            border-radius: 15px;
            font-size: 12px;
        }

        .profile-card a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #c86b96;
            padding: 10px 22px;
            border-radius: 20px;
        }

        .profile-card a:hover {
            background-color: #a74470;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="https://placehold.co/200x200/f0c7dc/8b4265?text=HA"
             alt="Hansika's profile picture">

        <h1>Hansika Arora</h1>
        <h3>BCA Artificial Intelligence Student</h3>

        <p>
            Hello! I am passionate about technology,
            programming, and data analytics.
            I love learning new skills and creating projects.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Python</span>
            <span>Power BI</span>
        </div>

        <a href="mailto:hello@example.com">Contact Me</a>

    </div>

</body>
</html>
